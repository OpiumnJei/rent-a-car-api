spring.application.name=rent-a-car-api
server.port=8080

# --- Datasource SQL Server local (dev: hardcodeo permitido) ---
# Por que del cambio: trabajo 100% local sin Docker contra .\SQLEXPRESS con la
# base rent_a_car_db ya creada (ver captura SSMS). El driver resuelve la instancia
# por SQL Browser (UDP 1434); si da timeout, arrancar SQL Server Browser y
# habilitar TCP/IP en SQL Server Configuration Manager.
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=rent_a_car_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Jg301102__
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA: Flyway manda, JPA obedece ---
# Por que del cambio: Spring minusculiza los @Table(name="CLIENTE") al validar y
# fallaba con "missing table [cliente]"; StandardImpl respeta el nombre exacto
# del V1 (mayusculas). Se quita hibernate.dialect (Hibernate lo detecta solo).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- JWT (dev: secreto hardcodeado; prod: variable de entorno) ---
app.jwt.secret=dev-secret-hardcoded-min-256-bits-para-agilizar-0123456789abcdef
app.jwt.expiration-ms=86400000

# --- Facturacion (dev: hardcodeado; prod: tabla PARAMETRO_FACTURACION) ---
app.billing.itbis-percent=18
app.billing.precio-por-nivel-combustible=1500
app.billing.precio-km-extra=50
app.billing.km-incluido-por-dia=200
app.billing.recargo-danio=8000
app.billing.recargo-retraso-dia=1000

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
